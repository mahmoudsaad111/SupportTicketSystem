server {
    listen 4200;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Angular's router uses real paths (not hash routing), so any path that
    # doesn't match a real static file must fall back to index.html and let
    # Angular's client-side router handle it — otherwise a hard refresh on
    # e.g. /my-tickets returns nginx's own 404 instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
