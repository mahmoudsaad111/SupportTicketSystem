name: Build and Deploy to MonsterASP.NET

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Build Angular first, then copy its output into the backend's
      # wwwroot so it gets published together with the API as one site.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: angular/yarn.lock

      - name: Install frontend dependencies
        working-directory: angular
        run: yarn install --frozen-lockfile

      - name: Build Angular (production)
        working-directory: angular
        run: yarn build --configuration production

      - name: Copy Angular build into backend wwwroot
        shell: pwsh
        run: |
          $dest = "aspnet-core/src/SupportTicketSystem.HttpApi.Host/wwwroot"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "angular/dist/SupportTicketSystem/browser/*" -Destination $dest -Recurse -Force

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # GitHub's windows-latest runner doesn't ship Web Deploy by default —
      # install it explicitly so MSBuild can actually push content over
      # MSDeploy/WMSVC to the shared host.
      - name: Install Web Deploy
        run: choco install webdeploy -y

      - name: Restore
        run: dotnet restore aspnet-core/src/SupportTicketSystem.HttpApi.Host/SupportTicketSystem.HttpApi.Host.csproj

      # Single site now — only one set of publish credentials needed, from
      # the ONE .PublishSettings file MonsterASP.NET gives you for this site
      # (Control Panel -> your site -> "Get Publish Profile" / Web Deploy):
      #   PUBLISH_SERVER   -> publishUrl (e.g. yourserver.monsterasp.net:8172)
      #   SITE_NAME        -> msdeploySite
      #   PUBLISH_USERNAME -> userName
      #   PUBLISH_PASSWORD -> userPWD
      # Add all four under Repo Settings -> Secrets and variables -> Actions.
      #
      # Uses `dotnet msbuild ... /t:Build` (not /t:Publish) with
      # DeployOnBuild=true — targeting Publish directly on top of
      # DeployOnBuild causes a known MSB4006 circular-dependency error in
      # the Sdk.Publish targets; Build + DeployOnBuild is the correct,
      # working combination (same one Visual Studio's own Publish uses).
      - name: Publish & deploy via Web Deploy
        run: |
          dotnet msbuild aspnet-core/src/SupportTicketSystem.HttpApi.Host/SupportTicketSystem.HttpApi.Host.csproj `
            /t:Build `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=MSDeploy `
            /p:MSDeployServiceUrl="${{ secrets.PUBLISH_SERVER }}" `
            /p:DeployIisAppPath="${{ secrets.SITE_NAME }}" `
            /p:UserName="${{ secrets.PUBLISH_USERNAME }}" `
            /p:Password="${{ secrets.PUBLISH_PASSWORD }}" `
            /p:AllowUntrustedCertificate=true `
            /p:MSDeployPublishMethod=WMSVC
