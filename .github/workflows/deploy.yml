name: Build and Deploy to MonsterASP.NET

on:
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest

    env:
      DOTNET_VERSION: "10.0.x"
      NODE_VERSION: "24"

    steps:
      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # Node / Angular
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: angular/yarn.lock

      - name: Verify Node version
        run: node --version

      - name: Install frontend dependencies
        working-directory: angular
        run: yarn install --frozen-lockfile

      - name: Build Angular
        working-directory: angular
        run: yarn build --configuration production

      # ==========================================
      # .NET
      # ==========================================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ==========================================
      # OpenIddict certificate
      # ==========================================
      - name: Prepare OpenIddict certificate
        shell: pwsh
        env:
          OPENIDDICT_PFX_BASE64: ${{ secrets.OPENIDDICT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPENIDDICT_PFX_BASE64)) {
            throw "Missing OPENIDDICT_PFX_BASE64 secret."
          }

          $pfxPath = "aspnet-core/src/SupportTicketSystem.HttpApi.Host/openiddict.pfx"

          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:OPENIDDICT_PFX_BASE64)
          )

      # ==========================================
      # ABP
      # ==========================================
      - name: Install ABP CLI
        run: |
          dotnet tool install --global Volo.Abp.Cli --version 10.6.0

      - name: Install ABP client-side libraries
        working-directory: aspnet-core
        shell: pwsh
        run: |
          abp install-libs

          if (!(Test-Path "src/SupportTicketSystem.HttpApi.Host/wwwroot/libs")) {
            throw "ABP libs folder was not created."
          }

      # ==========================================
      # Restore
      # ==========================================
      - name: Restore Host
        run: |
          dotnet restore `
            aspnet-core/src/SupportTicketSystem.HttpApi.Host/SupportTicketSystem.HttpApi.Host.csproj

      - name: Restore DbMigrator
        run: |
          dotnet restore `
            aspnet-core/src/SupportTicketSystem.DbMigrator/SupportTicketSystem.DbMigrator.csproj

      # ==========================================
      # Database migration
      # ==========================================
      - name: Run database migrations
        run: >
          dotnet run
          --project aspnet-core/src/SupportTicketSystem.DbMigrator/SupportTicketSystem.DbMigrator.csproj
          --configuration Release
          --no-restore
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__Default: ${{ secrets.PRODUCTION_CONNECTION_STRING }}
          # Without these, the seeder keeps checking the OpenIddict client
          # against DbMigrator/appsettings.json's committed localhost values
          # and never updates it to the real production domain -- this is
          # what caused the 400 after a successful login.
          OpenIddict__Applications__SupportTicketSystem_App__RootUrl: https://supportticketsystem.runasp.net
          OpenIddict__Applications__SupportTicketSystem_Swagger__RootUrl: https://supportticketsystem.runasp.net

      # ==========================================
      # Publish backend
      # ==========================================
      - name: Publish backend
        run: |
          dotnet publish `
            aspnet-core/src/SupportTicketSystem.HttpApi.Host/SupportTicketSystem.HttpApi.Host.csproj `
            --configuration Release `
            --output "$PWD/publish" `
            --nologo

      # ==========================================
      # Production secrets
      # ==========================================
      # appsettings.secrets.json is gitignored -- it never exists in this
      # checkout at all, so it can't be part of the publish output no matter
      # what MSBuild's content-inclusion rules say. The deployed app reads it
      # via ABP's AddAppSettingsSecretsJson() (see Program.cs), so we write it
      # directly into ./publish here, from the SAME secret already used for
      # the DbMigrator step above. That earlier env var only affected the
      # DbMigrator process during CI -- it never reached the actual deployed
      # SupportTicketSystem.HttpApi.Host.dll running on MonsterASP, which is
      # why the live app was still falling back to appsettings.json's local
      # dev connection string (MAHMOUD\SQLEXPRESS) and timing out.
      - name: Write production secrets
        shell: pwsh
        env:
          CONNECTION_STRING: ${{ secrets.PRODUCTION_CONNECTION_STRING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CONNECTION_STRING)) {
            throw "Missing PRODUCTION_CONNECTION_STRING secret."
          }

          $secrets = @{
            ConnectionStrings = @{
              Default = $env:CONNECTION_STRING
            }
          } | ConvertTo-Json -Depth 5

          $secretsPath = Join-Path $PWD "publish/appsettings.secrets.json"
          Set-Content -Path $secretsPath -Value $secrets -Encoding UTF8

          Write-Host "Wrote production appsettings.secrets.json to $secretsPath"

      # ==========================================
      # Find Angular index.html
      # ==========================================
      - name: Find Angular output
        shell: pwsh
        run: |
          Write-Host "Searching Angular output..."

          $indexes = Get-ChildItem `
            -Path "angular/dist" `
            -Filter "index.html" `
            -Recurse `
            -File

          if ($indexes.Count -eq 0) {
            Write-Host "Angular dist contents:"
            Get-ChildItem "angular/dist" -Recurse |
              Select-Object FullName

            throw "Angular index.html was not found."
          }

          $index = $indexes | Select-Object -First 1

          Write-Host "Angular index found:"
          Write-Host $index.FullName

          "ANGULAR_OUTPUT_DIR=$($index.Directory.FullName)" >> $env:GITHUB_ENV

      # ==========================================
      # Copy Angular into PUBLISHED wwwroot
      # ==========================================
      - name: Copy Angular into publish/wwwroot
        shell: pwsh
        run: |
          $source = $env:ANGULAR_OUTPUT_DIR
          $destination = Join-Path $PWD "publish/wwwroot"

          Write-Host "Angular source:"
          Write-Host $source

          Write-Host "Publish wwwroot:"
          Write-Host $destination

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $destination | Out-Null

          Copy-Item `
            -Path (Join-Path $source "*") `
            -Destination $destination `
            -Recurse `
            -Force

      # ==========================================
      # Verify FINAL publish structure
      # ==========================================
      - name: Verify published application
        shell: pwsh
        run: |
          $publish = Join-Path $PWD "publish"
          $wwwroot = Join-Path $publish "wwwroot"

          Write-Host "======================================"
          Write-Host "FINAL PUBLISH STRUCTURE"
          Write-Host "======================================"

          if (!(Test-Path $publish)) {
            throw "publish directory does not exist."
          }

          if (!(Test-Path $wwwroot)) {
            throw "publish/wwwroot does not exist."
          }

          if (!(Test-Path (Join-Path $wwwroot "index.html"))) {
            Write-Host "wwwroot contents:"
            Get-ChildItem $wwwroot -Recurse |
              Select-Object FullName

            throw "Angular index.html is missing from publish/wwwroot."
          }

          if (!(Test-Path (Join-Path $wwwroot "libs"))) {
            throw "ABP libs folder is missing from publish/wwwroot."
          }

          Write-Host "Angular index.html:"
          Get-Item (Join-Path $wwwroot "index.html")

          Write-Host ""
          Write-Host "publish/wwwroot contents:"
          Get-ChildItem $wwwroot |
            Select-Object Name

          Write-Host ""
          Write-Host "Frontend is READY."

      # ==========================================
      # Install Web Deploy
      # ==========================================
      - name: Install Web Deploy
        shell: pwsh
        run: |
          choco feature enable -n allowGlobalConfirmation
          choco install webdeploy -y --no-progress

      # ==========================================
      # Deploy
      # ==========================================
      - name: Deploy to MonsterASP
        timeout-minutes: 15
        shell: pwsh
        env:
          PUBLISH_SERVER: ${{ secrets.PUBLISH_SERVER }}
          SITE_NAME: ${{ secrets.SITE_NAME }}
          PUBLISH_USERNAME: ${{ secrets.PUBLISH_USERNAME }}
          PUBLISH_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
        run: |
          $msdeploy = Get-Command msdeploy.exe -ErrorAction SilentlyContinue

          if (-not $msdeploy) {
            $paths = @(
              "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe",
              "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
            )

            foreach ($path in $paths) {
              if (Test-Path $path) {
                $msdeploy = $path
                break
              }
            }
          }

          if (-not $msdeploy) {
            throw "msdeploy.exe was not found."
          }

          if ($msdeploy -is [System.Management.Automation.CommandInfo]) {
            $msdeployPath = $msdeploy.Source
          }
          else {
            $msdeployPath = $msdeploy
          }

          if ([string]::IsNullOrWhiteSpace($env:PUBLISH_SERVER)) {
            throw "PUBLISH_SERVER is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:SITE_NAME)) {
            throw "SITE_NAME is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:PUBLISH_USERNAME)) {
            throw "PUBLISH_USERNAME is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:PUBLISH_PASSWORD)) {
            throw "PUBLISH_PASSWORD is missing."
          }

          Write-Host "======================================"
          Write-Host "DEPLOYING TO MONSTERASP"
          Write-Host "======================================"

          Write-Host "Publish server: $env:PUBLISH_SERVER"
          Write-Host "Site: $env:SITE_NAME"

          # PUBLISH_SERVER must contain the Web Deploy host
          # from the MonsterASP publish profile, e.g.
          # site87155.siteasp.net
          #
          # Do NOT add the site name to the hostname here.

          $serverUrl = "https://$($env:PUBLISH_SERVER):8172/msdeploy.axd?site=$($env:SITE_NAME)"

          $destination =
            "contentPath=$($env:SITE_NAME)," +
            "computerName=$serverUrl," +
            "userName=$($env:PUBLISH_USERNAME)," +
            "password=$($env:PUBLISH_PASSWORD)," +
            "authtype=Basic"

          $sourcePath = Join-Path $PWD "publish"

          Write-Host "Source: $sourcePath"
          Write-Host "Destination site: $env:SITE_NAME"

          $psi = New-Object System.Diagnostics.ProcessStartInfo

          $psi.FileName = $msdeployPath

          $psi.ArgumentList.Add("-verb:sync")
          $psi.ArgumentList.Add("-source:contentPath=$sourcePath")
          $psi.ArgumentList.Add("-dest:$destination")
          $psi.ArgumentList.Add("-allowUntrusted")
          $psi.ArgumentList.Add("-disableLink:AppPoolExtension")
          $psi.ArgumentList.Add("-disableLink:ContentExtension")
          $psi.ArgumentList.Add("-disableLink:CertificateExtension")
          $psi.ArgumentList.Add("-enableRule:DoNotDeleteRule")
          $psi.ArgumentList.Add("-enableRule:AppOffline")

          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true

          $process = [System.Diagnostics.Process]::Start($psi)

          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()

          $process.WaitForExit()

          Write-Host $stdout

          if ($stderr) {
            Write-Host $stderr
          }

          if ($process.ExitCode -ne 0) {
            throw "MonsterASP deployment failed. Exit code: $($process.ExitCode)"
          }

          Write-Host "======================================"
          Write-Host "DEPLOYMENT SUCCESSFUL"
          Write-Host "======================================"