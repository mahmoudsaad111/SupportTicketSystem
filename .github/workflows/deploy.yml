name: Build and Deploy to MonsterASP.NET

on:
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Angular
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: angular/yarn.lock

      - name: Install frontend dependencies
        working-directory: angular
        run: yarn install --frozen-lockfile

      - name: Build Angular
        working-directory: angular
        run: yarn build --configuration production

      - name: Find Angular index.html
        shell: pwsh
        run: |
          Write-Host "Searching for Angular index.html..."

          $index = Get-ChildItem `
            -Path "angular/dist" `
            -Filter "index.html" `
            -Recurse `
            -File `
            | Select-Object -First 1

          if ($null -eq $index) {
            Write-Host "Angular dist contents:"
            Get-ChildItem -Path "angular/dist" -Recurse | Select-Object FullName

            throw "Angular index.html was not found under angular/dist."
          }

          Write-Host "Found Angular index.html:"
          Write-Host $index.FullName

          "ANGULAR_OUTPUT_DIR=$($index.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Copy Angular build into backend wwwroot
        shell: pwsh
        run: |
          $source = $env:ANGULAR_OUTPUT_DIR
          $dest = "aspnet-core/src/SupportTicketSystem.HttpApi.Host/wwwroot"

          Write-Host "Angular source: $source"
          Write-Host "Backend wwwroot: $dest"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $dest | Out-Null

          Copy-Item `
            -Path "$source/*" `
            -Destination $dest `
            -Recurse `
            -Force

      - name: Verify Angular files
        shell: pwsh
        run: |
          $wwwroot = "aspnet-core/src/SupportTicketSystem.HttpApi.Host/wwwroot"

          if (!(Test-Path "$wwwroot/index.html")) {
            throw "Angular index.html was not copied to wwwroot."
          }

          if (!(Test-Path "$wwwroot/libs")) {
            Write-Host "Warning: wwwroot/libs does not exist yet. ABP install-libs will run next."
          }

          Write-Host "Angular frontend successfully copied."
          Write-Host "index.html:"
          Get-Item "$wwwroot/index.html"

      # -------------------------
      # .NET
      # -------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # -------------------------
      # OpenIddict certificate
      # -------------------------
      - name: Prepare OpenIddict certificate
        shell: pwsh
        env:
          OPENIDDICT_PFX_BASE64: ${{ secrets.OPENIDDICT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPENIDDICT_PFX_BASE64)) {
            throw "Missing OPENIDDICT_PFX_BASE64 secret."
          }

          $pfxPath = "aspnet-core/src/SupportTicketSystem.HttpApi.Host/openiddict.pfx"

          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:OPENIDDICT_PFX_BASE64)
          )

      # -------------------------
      # ABP libraries
      # -------------------------
      - name: Install ABP CLI
        run: |
          dotnet tool install --global Volo.Abp.Cli --version 10.6.0

      - name: Install ABP client-side libraries
        working-directory: aspnet-core
        shell: pwsh
        run: |
          abp install-libs

          if (!(Test-Path "src/SupportTicketSystem.HttpApi.Host/wwwroot/libs")) {
            throw "ABP client-side libraries were not installed."
          }

          Write-Host "ABP client-side libraries installed successfully."

      # -------------------------
      # Verify complete wwwroot
      # -------------------------
      - name: Verify frontend before deployment
        shell: pwsh
        run: |
          $wwwroot = "aspnet-core/src/SupportTicketSystem.HttpApi.Host/wwwroot"

          if (!(Test-Path "$wwwroot/index.html")) {
            throw "index.html is missing from wwwroot."
          }

          if (!(Test-Path "$wwwroot/libs")) {
            throw "libs folder is missing from wwwroot."
          }

          Write-Host "Frontend deployment files are ready."

          Write-Host "wwwroot contents:"
          Get-ChildItem $wwwroot | Select-Object Name

      # -------------------------
      # Web Deploy
      # -------------------------
      - name: Install Web Deploy
        run: choco install webdeploy -y --no-progress

      # -------------------------
      # Restore
      # -------------------------
      - name: Restore Host
        run: dotnet restore aspnet-core/src/SupportTicketSystem.HttpApi.Host/SupportTicketSystem.HttpApi.Host.csproj

      - name: Restore DbMigrator
        run: dotnet restore aspnet-core/src/SupportTicketSystem.DbMigrator/SupportTicketSystem.DbMigrator.csproj

      # -------------------------
      # Database migration
      # -------------------------
      - name: Run database migrations
        run: >
          dotnet run
          --project aspnet-core/src/SupportTicketSystem.DbMigrator/SupportTicketSystem.DbMigrator.csproj
          --configuration Release
          --no-restore
        env:
          ConnectionStrings__Default: ${{ secrets.PRODUCTION_CONNECTION_STRING }}

      # -------------------------
      # Deploy
      # -------------------------
      - name: Publish and Deploy
        timeout-minutes: 10
        shell: pwsh
        env:
          PUBLISH_SERVER: ${{ secrets.PUBLISH_SERVER }}
          SITE_NAME: ${{ secrets.SITE_NAME }}
          PUBLISH_USERNAME: ${{ secrets.PUBLISH_USERNAME }}
          PUBLISH_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
        run: |
          dotnet msbuild `
            "aspnet-core/src/SupportTicketSystem.HttpApi.Host/SupportTicketSystem.HttpApi.Host.csproj" `
            /t:Build `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=MSDeploy `
            /p:MSDeployServiceUrl="$env:PUBLISH_SERVER" `
            /p:DeployIisAppPath="$env:SITE_NAME" `
            /p:UserName="$env:PUBLISH_USERNAME" `
            /p:Password="$env:PUBLISH_PASSWORD" `
            /p:AllowUntrustedCertificate=True `
            /p:MSDeployPublishMethod=WMSVC