name: Build and Deploy to MonsterASP.NET

on:
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest

    env:
      DOTNET_VERSION: "10.0.x"
      NODE_VERSION: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Setup Node
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: angular/yarn.lock

      # -------------------------
      # Build Angular
      # -------------------------
      - name: Install frontend dependencies
        working-directory: angular
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: angular
        run: yarn build --configuration production

      # -------------------------
      # Setup .NET
      # -------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # -------------------------
      # OpenIddict certificate
      # -------------------------
      - name: Prepare OpenIddict certificate
        shell: pwsh
        env:
          OPENIDDICT_PFX_BASE64: ${{ secrets.OPENIDDICT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPENIDDICT_PFX_BASE64)) {
            throw "Missing OPENIDDICT_PFX_BASE64 secret."
          }

          $pfxPath = "aspnet-core/src/SupportTicketSystem.HttpApi.Host/openiddict.pfx"

          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:OPENIDDICT_PFX_BASE64)
          )

      # -------------------------
      # ABP CLI
      # -------------------------
      - name: Install ABP CLI
        run: |
          dotnet tool install --global Volo.Abp.Cli --version 10.6.0

      - name: Install ABP client-side libraries
        working-directory: aspnet-core
        shell: pwsh
        run: |
          abp install-libs

          if (!(Test-Path "src/SupportTicketSystem.HttpApi.Host/wwwroot/libs")) {
            throw "ABP client-side libraries were not installed."
          }

      # -------------------------
      # Restore
      # -------------------------
      - name: Restore Host
        run: |
          dotnet restore aspnet-core/src/SupportTicketSystem.HttpApi.Host/SupportTicketSystem.HttpApi.Host.csproj

      - name: Restore DbMigrator
        run: |
          dotnet restore aspnet-core/src/SupportTicketSystem.DbMigrator/SupportTicketSystem.DbMigrator.csproj

      # -------------------------
      # Database migration
      # -------------------------
      - name: Run database migrations
        run: >
          dotnet run
          --project aspnet-core/src/SupportTicketSystem.DbMigrator/SupportTicketSystem.DbMigrator.csproj
          --configuration Release
          --no-restore
        env:
          ConnectionStrings__Default: ${{ secrets.PRODUCTION_CONNECTION_STRING }}

      # -------------------------
      # Publish backend
      # -------------------------
      - name: Publish backend
        run: |
          dotnet publish `
            aspnet-core/src/SupportTicketSystem.HttpApi.Host/SupportTicketSystem.HttpApi.Host.csproj `
            --configuration Release `
            --output ./publish `
            --nologo

      # -------------------------
      # Copy Angular into publish/wwwroot
      # -------------------------
      - name: Prepare static frontend files
        shell: pwsh
        run: |
          $frontendDist = "angular/dist/SupportTicketSystem/browser"
          $publishWwwroot = "publish/wwwroot"

          Write-Host "Angular output: $frontendDist"

          if (!(Test-Path $frontendDist)) {
            Write-Host "Angular dist contents:"
            Get-ChildItem "angular/dist" -Recurse |
              Select-Object FullName

            throw "Angular output directory was not found."
          }

          New-Item `
            -ItemType Directory `
            -Path $publishWwwroot `
            -Force | Out-Null

          Copy-Item `
            -Path "$frontendDist/*" `
            -Destination $publishWwwroot `
            -Recurse `
            -Force

          if (!(Test-Path "$publishWwwroot/index.html")) {
            throw "Angular index.html was not copied to publish/wwwroot."
          }

          Write-Host "Angular frontend copied successfully."

      # -------------------------
      # Verify final publish
      # -------------------------
      - name: Verify publish folder
        shell: pwsh
        run: |
          Write-Host "========== publish/wwwroot =========="

          Get-ChildItem "publish/wwwroot" |
            Select-Object Name, Length |
            Format-Table -AutoSize

          if (!(Test-Path "publish/wwwroot/index.html")) {
            throw "publish/wwwroot/index.html is missing."
          }

          if (!(Test-Path "publish/wwwroot/libs")) {
            throw "publish/wwwroot/libs is missing."
          }

          Write-Host "Frontend is ready for deployment."

      # -------------------------
      # Install Web Deploy
      # -------------------------
      - name: Install Web Deploy
        shell: pwsh
        run: |
          choco feature enable -n allowGlobalConfirmation
          choco install webdeploy -y --no-progress

      # -------------------------
      # Deploy
      # -------------------------
      - name: Deploy to MonsterASP
        timeout-minutes: 10
        shell: pwsh
        env:
          PUBLISH_URL: ${{ secrets.PUBLISH_SERVER }}
          MSDEPLOY_SITE: ${{ secrets.SITE_NAME }}
          USERNAME: ${{ secrets.PUBLISH_USERNAME }}
          PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
        run: |
          $msdeploy = Get-Command msdeploy.exe -ErrorAction SilentlyContinue

          if (-not $msdeploy) {
            $candidates = @(
              "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe",
              "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
            )

            $msdeploy = $candidates |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }

          if (-not $msdeploy) {
            throw "msdeploy.exe was not found."
          }

          $msdeployPath =
            if ($msdeploy -is [System.Management.Automation.CommandInfo]) {
              $msdeploy.Source
            }
            else {
              $msdeploy
            }

          if (
            [string]::IsNullOrWhiteSpace($env:PUBLISH_URL) -or
            [string]::IsNullOrWhiteSpace($env:MSDEPLOY_SITE) -or
            [string]::IsNullOrWhiteSpace($env:USERNAME) -or
            [string]::IsNullOrWhiteSpace($env:PASSWORD)
          ) {
            throw "Missing deployment secrets."
          }

          $destValue = `
            "contentPath=$env:MSDEPLOY_SITE," +
            "computerName=https://$env:PUBLISH_URL/msdeploy.axd?site=$env:MSDEPLOY_SITE," +
            "userName=$env:USERNAME," +
            "password=$env:PASSWORD," +
            "authtype=Basic"

          $psi = New-Object System.Diagnostics.ProcessStartInfo

          $psi.FileName = $msdeployPath

          $psi.ArgumentList.Add("-verb:sync")

          $psi.ArgumentList.Add(
            "-source:contentPath=$PWD\publish"
          )

          $psi.ArgumentList.Add(
            "-dest:$destValue"
          )

          $psi.ArgumentList.Add("-allowUntrusted")
          $psi.ArgumentList.Add("-disableLink:AppPoolExtension")
          $psi.ArgumentList.Add("-disableLink:ContentExtension")
          $psi.ArgumentList.Add("-enableRule:DoNotDeleteRule")
          $psi.ArgumentList.Add("-enableRule:AppOffline")

          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true

          $process = [System.Diagnostics.Process]::Start($psi)

          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()

          $process.WaitForExit()

          Write-Host $stdout

          if ($stderr) {
            Write-Host $stderr
          }

          if ($process.ExitCode -ne 0) {
            throw "msdeploy failed with exit code $($process.ExitCode)"
          }

          Write-Host "Deployment completed successfully."