services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportticketsystem-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Runs once: applies EF Core migrations, then every IDataSeedContributor
  # (admin user, permissions, and the 20 seed tickets), then exits. The
  # backend waits for this to finish successfully before starting.
  dbmigrator:
    build:
      context: ./aspnet-core
      dockerfile: src/SupportTicketSystem.DbMigrator/Dockerfile
    container_name: supportticketsystem-dbmigrator
    environment:
      # Overrides appsettings.json's Trusted_Connection (Windows auth,
      # which doesn't exist inside a Linux container) with SQL auth against
      # the sqlserver service above. ASP.NET Core's config system maps
      # double-underscore env vars onto nested JSON keys automatically, so
      # this needs no change to any appsettings.json file.
      ConnectionStrings__Default: "Server=sqlserver;Database=SupportTicketSystemDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=true"
    depends_on:
      sqlserver:
        condition: service_healthy

  backend:
    build:
      context: ./aspnet-core
      dockerfile: src/SupportTicketSystem.HttpApi.Host/Dockerfile
    container_name: supportticketsystem-backend
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=SupportTicketSystemDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=true"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${CERT_PASSWORD}
    ports:
      - "44376:44376"
      - "8080:8080"
    volumes:
      - ${CERT_PATH}:/https:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      dbmigrator:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./angular
      dockerfile: Dockerfile
    container_name: supportticketsystem-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  sqlserver-data:
